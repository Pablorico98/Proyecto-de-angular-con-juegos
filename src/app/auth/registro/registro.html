<div class="auth-container">
  <div class="card-registro">
    <div class="registro-header">
      <h2>Crear Cuenta</h2>
      <p>Unite a la Sala de Juegos para empezar a medir tus estadísticas.</p>
    </div>

    <form [formGroup]="formRegistro" (ngSubmit)="registrar()" class="registro-form">
      <div class="form-row">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input type="text" id="nombre" formControlName="nombre" placeholder="Tu nombre">
        </div>
        <div class="form-group">
          <label for="apellido">Apellido</label>
          <input type="text" id="apellido" formControlName="apellido" placeholder="Tu apellido">
        </div>
      </div>

      <div class="form-group">
        <label for="email">Correo Electrónico</label>
        <input type="email" id="email" formControlName="email" placeholder="ejemplo@correo.com">
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="edad">Edad</label>
          <input type="number" id="edad" formControlName="edad" placeholder="18 - 99">
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" formControlName="password" placeholder="Mínimo 6 caracteres">
        </div>
      </div>

      <div class="acciones">
        <button type="submit" [disabled]="formRegistro.invalid" class="btn-principal">
          Registrarme
        </button>
        <p class="switch-auth">¿Ya tenés cuenta? <a routerLink="/login">Iniciá sesión</a></p>
      </div>
    </form>
  </div>

  @if (modalService.mostrarModal()) {
    <app-modal-aviso 
        [titulo]="'Usuario Existente'"
        [mensaje]="'El correo ingresado ya se encuentra en nuestra base de datos. ¿Querés intentar iniciar sesión?'"
        [textoConfirmar]="'Ir al Login'"
        [textoCancelar]="'Cerrar'"
        (confirmar)="irAlLogin()"
        (cancelar)="modalService.cerrar()">
    </app-modal-aviso>
  }
</div>
