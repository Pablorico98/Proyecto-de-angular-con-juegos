<div class="main">
    <h1>¡Bienvenido a sala de juegos!</h1>
    
    <p>Navegá desde el menú superior para iniciar sesión o registrarte.</p>

    <!-- BOTÓN DE CHAT INDEPENDIENTE -->
    <div class="seccion-acciones-principales">
        @if (!esChatActivo()) {
            <button (click)="toggleChat('/chat')" [disabled]="bloquearBotonChat()" class="btn-acceso-chat">
                <span class="icon">💬</span> Abrir Chat Global
            </button>
        } 
        @else {
            <button (click)="toggleChat('/')" [disabled]="bloquearBotonChat()" class="btn-acceso-chat btn-cerrar-chat">
                <span class="icon">❌</span> Cerrar Chat
            </button>
        }
    </div>

    <div class="grilla-tarjetas">
        @for (item of misTarjetas; track item.titulo) {
            <app-card 
                [titulo]="item.titulo" 
                [subtitulo]="item.subtitulo" 
                [imagen]="item.imagen" 
                [link]="item.link">
            </app-card>
        }
    </div>

    <!-- SECCIÓN DINÁMICA -->
    <div class="seccion-chat">
        <router-outlet></router-outlet>
    </div>

    <!-- MODAL DE AVISO -->
    @if (modalService.mostrarModal()) {
        <app-modal-aviso 
            [titulo]="'Acceso Restringido'"
            [mensaje]="'Para participar del chat global o acceder a los juegos, primero debés iniciar sesión.'"
            [textoConfirmar]="'Ir al Login'"
            [textoCancelar]="'Cerrar'"
            (confirmar)="irAlLogin()"
            (cancelar)="cerrarModal()">
        </app-modal-aviso>
    }
</div>
